<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title" shape-rendering="crispEdges">
  <title id="title">Pixel cat</title>
  <style>
    .frame-a { animation: frame-a 1.2s step-end infinite; }
    .frame-b { opacity: 0; animation: frame-b 1.2s step-end infinite; }
    @keyframes frame-a { 50%, 100% { opacity: 0; } }
    @keyframes frame-b { 50%, 100% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .frame-a, .frame-b { animation: none; } }
  </style>
  <rect width="64" height="64" rx="8" fill="#091426"/>

  <!-- Ears and head -->
  <rect x="12" y="12" width="12" height="12" fill="#c97a40"/>
  <rect x="40" y="12" width="12" height="12" fill="#c97a40"/>
  <rect x="16" y="8" width="8" height="8" fill="#c97a40"/>
  <rect x="40" y="8" width="8" height="8" fill="#c97a40"/>
  <rect x="16" y="16" width="4" height="4" fill="#ff87bd"/>
  <rect x="44" y="16" width="4" height="4" fill="#ff87bd"/>
  <rect x="12" y="20" width="40" height="28" fill="#e89a58"/>
  <rect x="16" y="48" width="32" height="4" fill="#e89a58"/>

  <!-- Face markings -->
  <rect x="28" y="20" width="8" height="8" fill="#c97a40"/>
  <g class="frame-a">
    <rect x="20" y="28" width="8" height="8" fill="#f8fafc"/>
    <rect x="36" y="28" width="8" height="8" fill="#f8fafc"/>
    <rect x="24" y="28" width="4" height="8" fill="#10213b"/>
    <rect x="36" y="28" width="4" height="8" fill="#10213b"/>
  </g>
  <g class="frame-b">
    <rect x="20" y="32" width="8" height="4" fill="#10213b"/>
    <rect x="36" y="32" width="8" height="4" fill="#10213b"/>
  </g>
  <rect x="28" y="36" width="8" height="4" fill="#ff4fa3"/>
  <rect x="24" y="40" width="8" height="4" fill="#f2e7c6"/>
  <rect x="32" y="40" width="8" height="4" fill="#f2e7c6"/>
  <rect x="28" y="44" width="8" height="4" fill="#10213b"/>

  <!-- Whiskers -->
  <rect x="4" y="36" width="16" height="2" fill="#35d9ff"/>
  <rect x="8" y="42" width="12" height="2" fill="#35d9ff"/>
  <rect x="44" y="36" width="16" height="2" fill="#35d9ff"/>
  <rect x="44" y="42" width="12" height="2" fill="#35d9ff"/>
</svg>
