<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title" shape-rendering="crispEdges">
  <title id="title">Pixel science flask with molecule bubbles</title>
  <style>
    .frame-a { animation: frame-a 1.2s step-end infinite; }
    .frame-b { opacity: 0; animation: frame-b 1.2s step-end infinite; }
    @keyframes frame-a { 50%, 100% { opacity: 0; } }
    @keyframes frame-b { 50%, 100% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .frame-a, .frame-b { animation: none; } }
  </style>
  <rect width="64" height="64" rx="8" fill="#091426"/>
  <rect x="24" y="8" width="16" height="4" fill="#f2e7c6"/><rect x="28" y="12" width="8" height="18" fill="#f2e7c6"/>
  <rect x="22" y="30" width="20" height="4" fill="#f2e7c6"/><rect x="18" y="34" width="28" height="16" fill="#35d9ff"/>
  <rect x="22" y="50" width="20" height="4" fill="#315bff"/><rect x="14" y="38" width="4" height="12" fill="#35d9ff"/>
  <rect x="46" y="38" width="4" height="12" fill="#35d9ff"/><rect x="24" y="38" width="4" height="4" fill="#ffd83d"/>
  <rect x="34" y="44" width="4" height="4" fill="#ff4fa3"/>
  <g class="frame-a">
    <rect x="47" y="13" width="6" height="6" fill="#ff4fa3"/><rect x="51" y="9" width="4" height="4" fill="#f2e7c6"/>
    <rect x="42" y="20" width="4" height="4" fill="#ffd83d"/><rect x="13" y="17" width="6" height="6" fill="#35d9ff"/>
    <rect x="9" y="13" width="4" height="4" fill="#f2e7c6"/>
  </g>
  <g class="frame-b">
    <rect x="43" y="9" width="6" height="6" fill="#ff4fa3"/><rect x="51" y="5" width="4" height="4" fill="#f2e7c6"/>
    <rect x="46" y="18" width="4" height="4" fill="#ffd83d"/><rect x="17" y="13" width="6" height="6" fill="#35d9ff"/>
    <rect x="9" y="9" width="4" height="4" fill="#f2e7c6"/>
  </g>
</svg>
