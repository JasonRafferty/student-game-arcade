<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Play a student-created game in the Student Game Arcade.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
  <title>Play | Student Game Arcade</title>
</head>
<body class="font-body text-white">
  <a class="skip-link" href="#main">Skip to game</a>

  <header class="arcade-nav sticky top-0 z-50">
    <div class="max-w-7xl mx-auto flex h-16 items-center justify-between gap-3 px-4 sm:px-6">
      <a href="./" class="inline-flex items-center gap-2 rounded font-arcade text-[0.58rem] leading-relaxed text-gold focus:outline-none focus:ring-2 focus:ring-gold sm:text-[0.7rem]">
        <span aria-hidden="true">🕹️</span> Arcade
      </a>
      <div class="flex items-center gap-2 sm:gap-4">
        <a href="./" class="rounded px-2 py-2 text-sm font-semibold text-arcade-blue hover:text-white focus:outline-none focus:ring-2 focus:ring-arcade-blue">← All games</a>
        <a href="https://jasonrafferty.github.io/" class="hidden rounded px-2 py-2 text-sm font-semibold text-slate-300 hover:text-gold focus:outline-none focus:ring-2 focus:ring-gold sm:inline-flex">Tutoring site</a>
      </div>
    </div>
  </header>

  <main id="main">
    <section class="border-b border-gold/30 bg-navy/80 py-9">
      <div class="max-w-7xl mx-auto px-4 sm:px-6">
        <p class="font-arcade text-[0.52rem] uppercase tracking-wider text-arcade-pink">Now Playing</p>
        <div class="mt-4 flex flex-col gap-6 sm:flex-row sm:items-end sm:justify-between">
          <div>
            <h1 class="font-arcade text-xl leading-relaxed text-gold sm:text-2xl" data-game-title>Loading game…</h1>
            <p class="mt-3 max-w-2xl text-sm leading-relaxed text-slate-300" data-player-message aria-live="polite">Preparing the game.</p>
          </div>
          <div class="flex flex-wrap gap-4">
            <button type="button" class="arcade-button arcade-button--outline px-4 py-3 font-arcade text-[0.5rem] leading-relaxed focus:outline-none focus:ring-2 focus:ring-arcade-blue" data-game-share>
              <span data-game-share-label>Share with a friend</span>
            </button>
            <button type="button" class="arcade-button arcade-button--outline px-4 py-3 font-arcade text-[0.5rem] leading-relaxed focus:outline-none focus:ring-2 focus:ring-arcade-blue" data-fullscreen>Full Screen</button>
            <a class="arcade-button px-4 py-3 font-arcade text-[0.5rem] leading-relaxed focus:outline-none focus:ring-2 focus:ring-gold" href="#" target="_blank" rel="noopener noreferrer" data-direct-link>Open Game ↗</a>
          </div>
        </div>
      </div>
    </section>

    <section class="py-7 lg:py-10">
      <div class="max-w-7xl mx-auto px-4 sm:px-6">
        <div class="game-frame-shell overflow-hidden">
          <div class="flex items-center justify-between border-b-2 border-gold/60 bg-[#060d19] px-4 py-3">
            <div class="flex items-center gap-2"><span class="status-light"></span><span class="font-arcade text-[0.45rem] text-arcade-blue">GAME RUNNING</span></div>
            <span class="font-arcade text-[0.42rem] text-slate-500">PLAYER 1</span>
          </div>
          <iframe class="game-frame" data-game-frame title="Student game" allow="fullscreen; autoplay"></iframe>
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="/js/play.js"></script>
</body>
</html>
